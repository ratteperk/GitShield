apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-shield-deployment
  labels:
    app: git-shield
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-shield
  template:
    metadata:
      labels:
        app: git-shield
    spec:
      containers:
      - name: git-shield
        image: ghcr.io/ratteperk/gitshield:latest
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 4123
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 4123
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 4123
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 5