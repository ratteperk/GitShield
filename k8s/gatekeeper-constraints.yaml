---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RequireImageTag
metadata:
  name: require-image-tag
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - argocd
      - monitoring
      - cert-manager
  parameters:
    exemptImages:
      - "ghcr.io/ratteperk/gitshield:latest"
      - "ghcr.io/ratteperk/gitshield"