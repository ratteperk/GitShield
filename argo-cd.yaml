apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: get-shield-app
  namespace: argocd
spec:
  project: default
  source:
    path: k8s
    repoURL: 'https://github.com/ratteperk/GitShield'
    targetRevision: main
  destination:
    namespace: default
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true