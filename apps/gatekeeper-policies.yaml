apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ratteperk/GitShield'
    targetRevision: main
    path: k8s
    directory:
      include: 'gatekeeper-*.yaml'
      exclude: '*'
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true